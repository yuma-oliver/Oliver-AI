[package]
name = "oliver-ai"
version = "0.1.0"
description = "Oliver AI — Claude API搭載社内向けAI秘書"
authors = ["Oliver Inc."]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oliver_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
